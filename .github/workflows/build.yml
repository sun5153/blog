# Dev 分支推送部署预览
name: Build Dev

on:
  push:
    branches:
      - dev
      - master

jobs:
  release:
    name: Build & Deploy Website
    runs-on: ubuntu-latest # 改为 Linux 环境，对 SSH 部署支持更好

    steps:
      # 检出 Git 仓库
      - name: Check out git repository
        uses: actions/checkout@v4.1.1

      # 安装 Node.js
      - name: Install Node.js
        uses: actions/setup-node@v4.0.0
        with:
          node-version: "18.x"

      # 复制环境变量文件
      - name: Copy .env.example
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          else
            echo ".env file already exists. Skipping the copy step."
          fi

      # 安装项目依赖
      - name: Install Dependencies
        run: npm install

      # 构建程序
      - name: Build Website
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}

      # ================= 自动部署到服务器 =================
     # ... 前面的安装编译步骤保持不变 ...

      # 1. 传文件：用受限的 deploy 账号（被 Chroot 限制在 html 目录）
      - name: Deploy to Server
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "dist/"
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: "deploy" # 👈 这里强制用 deploy
          REMOTE_PORT: 10022
          TARGET: ${{ secrets.TARGET_DIR }} # 填 /personal_web 相对于 chroot 根目录的路径
          EXCLUDE: "/node_modules/"

      # 2. 压缩：用 root 账号（去服务器上执行压缩命令）
      - name: Gzip Compression
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: "root" # 👈 这里强制用 root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 10022
          script: |
            # 注意：执行完 deploy 传文件后，所有文件归属可能是 deploy，root 可以直接操作
            cd /usr/share/nginx/html/personal_web/
            gzip -kf index.html
            find assets/ -type f ! -name "*.gz" -exec gzip -kf {} \;
